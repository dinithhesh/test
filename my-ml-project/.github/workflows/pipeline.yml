name: ML-Pipeline
on: [push]
jobs:
  ml-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: pip install -r requirements.txt
      - name: Train
        run: python train.py
      - name: Check
        run: python check_results.py
